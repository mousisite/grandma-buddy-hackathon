# Render "Blueprint": a public demo of Grandma Buddy (docs/DEPLOY.md).
# Render reads this file when you make a Blueprint from the repository.
services:
  - type: web
    name: grandma-buddy
    runtime: docker
    # "pro plus" (4 CPU, 8 GB) for Buddy's natural voice. The Kokoro model
    # takes about 550 MB; on one thread a short sentence takes 1.4 seconds,
    # on two 0.8 (measured on "pro": her first words 0.9 to 1.25 s after the
    # text), and four threads roughly halve that again. "standard" (1 CPU)
    # would leave her waiting; "starter" (512 MB) can't hold the model at all,
    # so the browser's voice speaks there.
    plan: pro plus
    numInstances: 1          # one instance, one process: the voice's cache and shares live in one process
    healthCheckPath: /api/ping
    envVars:
      - key: PUBLIC_DEMO
        value: "1"
      - key: ALLOWED_HOSTS
        value: grandma-buddy.onrender.com   # change to your service's own address
      - key: MODEL_API_KEY
        sync: false          # a secret: Render asks you for it, and never shows it
      - key: AI_CALLS_PER_VISITOR_HOUR
        value: "40"
      - key: AI_CALLS_PER_DAY
        value: "600"
      - key: VOICE_THREADS
        value: "4"           # ONNX Runtime threads for the voice: the plan's 4 CPUs
      - key: WEB_CONCURRENCY
        value: "1"           # one server process (Render's own default is 2 on this plan; see the Dockerfile)
      - key: VOICE_SENTENCES_PER_VISITOR_HOUR
        value: "300"         # each visitor's share of the natural voice (the safety words are never capped)
      - key: DEMO_RESET_HOUR
        value: "9"           # 9:00 UTC is 1:00 AM Pacific
      - key: DATABASE_PATH
        value: data/grandma_buddy.db
