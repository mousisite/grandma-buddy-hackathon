<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portrait corner</title>
<link rel="stylesheet" href="cards.css">
<style>
  /* Rose's portrait for the picture-in-picture corner of her story:
     rounded like a sheet, a thin white edge, the app's raised shadow,
     everything else transparent (rendered by scripts/video_cards.py). */
  html, body { background: transparent; }
  .portrait {
    position: absolute;
    right: 84px;
    bottom: 84px;
    width: 400px;
    height: 400px;
    border-radius: 28px;
    border: 6px solid #FFFFFF;
    box-shadow: 0 1px 2px rgba(28, 27, 25, 0.05), 0 8px 24px rgba(28, 27, 25, 0.07), 0 28px 56px -16px rgba(28, 27, 25, 0.16);
    object-fit: cover;
    background: #FFFFFF;
  }
</style>
</head>
<body>
  <img class="portrait" src="../../intro/rose-portrait.png" alt="Rose, a made-up older woman, painted in watercolor">
</body>
</html>
